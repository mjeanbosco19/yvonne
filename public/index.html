<!DOCTYPE html>
<html lang="rw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinyarwanda Irembo AI Helpdesk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffffff, #2ae9f77e, #64B5F6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Chat Widget Container */
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 90%;
            /* Default for small screens */
            height: 80vh;
            /* Default height */
            max-width: 450px;
            /* Increased base max-width */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Responsive Design Updates */
        @media (min-width: 768px) {
            .chat-container {
                width: 80%;
                max-width: 600px;
                /* Medium screens */
            }
        }

        @media (min-width: 1200px) {
            .chat-container {
                width: 50%;
                max-width: 800px;
                /* Large screens */
            }
        }

        /* Minimize/Maximize functionality */
        .chat-container.minimized {
            height: 60px;
            cursor: pointer;
        }

        .minimize-button {
            position: absolute;
            top: 15px;
            right: 50px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            z-index: 2;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            z-index: 2;
        }

        /* Header Styles */
        .chat-header {
            background: linear-gradient(to right, #0B3B86, #1565C0);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 60px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header img {
            height: 30px;
            width: auto;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.1rem;
            flex-grow: 1;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #f8faff, #ffffff);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #0B3B86, #1565C0);
            color: white;
            box-shadow: 0 2px 5px rgba(11, 59, 134, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bot-message .message-content {
            background: linear-gradient(to bottom right, #ffffff, #f8faff);
            color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e8eef3;
        }

        /* Input Area */
        .input-container {
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-top: 1px solid rgba(11, 59, 134, 0.1);
            display: flex;
            gap: 8px;
        }

        #user-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #e8eef3;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            background: rgba(248, 250, 255, 0.9);
            color: #2c3e50;
            transition: all 0.3s ease;
        }

        #user-input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(11, 59, 134, 0.1);
        }

        #send-button {
            background: linear-gradient(135deg, #0B3B86, #1565C0);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        #send-button:hover {
            background: linear-gradient(135deg, #092a61, #0d47a1);
            transform: translateY(-1px);
        }

        #send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Update Mobile Responsiveness */
        @media (max-width: 480px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                bottom: 0;
                right: 0;
                border-radius: 0;
                max-width: none;
            }

            .chat-container.minimized {
                height: 60px;
                width: 300px;
                right: 20px;
                bottom: 20px;
                border-radius: 12px;
            }
        }

        /* Chat Toggle Button */
        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0B3B86, #1565C0);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 59, 134, 0.2);
            transition: all 0.3s ease;
            z-index: 1000;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Repositioned Tagline */
        .chat-toggle::before {
            content: 'Twandikire';
            position: absolute;
            left: -85px;
            /* Position to the left */
            top: 50%;
            /* Center vertically */
            transform: translateY(-50%);
            background: rgba(11, 59, 134, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Mobile adjustment */
        @media (max-width: 480px) {
            .chat-toggle::before {
                left: -75px;
                font-size: 12px;
                padding: 4px 10px;
            }
        }

        .chat-toggle:hover {
            background: linear-gradient(135deg, #092a61, #0d47a1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .chat-toggle svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .chat-toggle.bounce {
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Notification Badge */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: linear-gradient(135deg, #ff4444, #ff1744);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            display: none;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(255, 23, 68, 0.3);
        }

        /* Mobile Responsiveness Update */
        @media (max-width: 480px) {
            .chat-toggle {
                bottom: 15px;
                right: 15px;
                width: 50px;
                height: 50px;
            }

            .chat-toggle svg {
                width: 25px;
                height: 25px;
            }
        }

        /* Error Message */
        .error-message {
            background: linear-gradient(to right, #fee2e2, #fecaca);
            color: #dc2626;
            padding: 10px 15px;
            margin: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #dc2626;
        }

        /* Typing Indicator */
        .typing-indicator {
            background: linear-gradient(to right, #f0f7ff, #f8faff);
            padding: 10px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            margin: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background: linear-gradient(135deg, #0B3B86, #1565C0);
            border-radius: 50%;
            opacity: 0.6;
            animation: bounce 1.3s linear infinite;
        }

        .welcome-message {
            background: linear-gradient(to right, #f0f7ff, #f8faff);
            color: #2c3e50;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e8eef3;
            border-left: 4px solid #0B3B86;
        }

        /* Service Details */
        .service-details {
            background: linear-gradient(to right, #f0f7ff, #f8faff);
            border: 1px solid #e8eef3;
        }

        .service-cost {
            color: #0B3B86;
        }

        .service-time {
            color: #64748b;
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: linear-gradient(to bottom, #f8faff, #ffffff);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #cbd5e1, #94a3b8);
            border: 2px solid #f8faff;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #94a3b8, #64748b);
        }

        /* Glass Effect for Container */
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <!-- Add Chat Toggle Button -->
    <div class="chat-toggle" id="chatToggle" onclick="showChat()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" />
            <path d="M7 9h10M7 12h7" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
        <div class="notification-badge" id="notificationBadge">1</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <h2>KINYARWANDA AI HelpDesk for IremboGov</h2>
            <button class="minimize-button" onclick="toggleChat()">−</button>
            <button class="close-button" onclick="closeChat()">×</button>
        </div>
        <div class="welcome-message">
            Murakaza neza! Mushobora kubaza ikibazo icyo aricyo cyose kijyanye na serivisi za Leta.
        </div>
        <div id="chat-messages" class="chat-messages">
            <div id="typing-indicator" class="typing-indicator" style="display: none;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div id="error-message" class="error-message"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Andika ubutumwa bwawe hano..." maxlength="500">
            <button id="send-button" onclick="sendMessage()">Ohereza</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');
        const errorMessage = document.getElementById('error-message');

        // Load chat history on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (data.history && data.history.length > 0) {
                    data.history.forEach(entry => {
                        addMessage(entry.user, true);
                        addMessage(entry.bot, false);
                    });
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        });

        function showTypingIndicator() {
            typingIndicator.style.display = 'flex';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function formatServiceDetails(message) {
            if (message.includes('Igiciro :') || message.includes('Igihe dosiye imara :')) {
                return message.replace(/\n/g, '<br>')
                    .replace(/Igiciro :/g, '<span class="service-cost">Igiciro:</span>')
                    .replace(/Igihe dosiye imara :/g, '<span class="service-time">Igihe dosiye imara:</span>');
            }
            return message.replace(/\n/g, '<br>');
        }

        function addMessage(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = formatServiceDetails(message);

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Disable input and button while processing
            userInput.disabled = true;
            sendButton.disabled = true;

            // Add user message to chat
            addMessage(message, true);
            userInput.value = '';
            showTypingIndicator();

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage(data.answer, false);
                } else {
                    showError(data.answer || "Mbabarira, hari ikibazo cyavutse.");
                }
            } catch (error) {
                console.error('Error:', error);
                showError("Mbabarira, hari ikibazo cyavutse.");
            } finally {
                hideTypingIndicator();
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        async function toggleHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                // Clear current messages
                while (messagesContainer.firstChild) {
                    messagesContainer.removeChild(messagesContainer.firstChild);
                }

                // Add history messages
                if (data.history && data.history.length > 0) {
                    data.history.forEach(entry => {
                        addMessage(entry.user, true);
                        addMessage(entry.bot, false);
                    });
                }
            } catch (error) {
                console.error('Error loading history:', error);
                showError("Mbabarira, hari ikibazo mu kuzana amateka.");
            }
        }

        // Allow sending message with Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Check server health on page load
        fetch('/api/health')
            .catch(error => {
                console.error('Health check failed:', error);
                showError("Mbabarira, seriveri ntikora neza.");
            });

        function toggleChat() {
            const container = document.getElementById('chatContainer');
            container.classList.toggle('minimized');
            const button = document.querySelector('.minimize-button');
            button.textContent = container.classList.contains('minimized') ? '+' : '−';

            if (container.classList.contains('minimized')) {
                hideChat();
            }
        }

        function closeChat() {
            hideChat();
        }

        // Add this to your existing script
        document.getElementById('chatContainer').addEventListener('click', function (e) {
            if (this.classList.contains('minimized') &&
                !e.target.classList.contains('close-button')) {
                toggleChat();
            }
        });

        // Add these new functions
        function showChat() {
            const chatContainer = document.getElementById('chatContainer');
            const chatToggle = document.getElementById('chatToggle');
            const notificationBadge = document.getElementById('notificationBadge');

            chatContainer.style.display = 'flex';
            chatToggle.style.display = 'none';
            notificationBadge.style.display = 'none';

            // If chat was minimized, maximize it
            chatContainer.classList.remove('minimized');
        }

        function hideChat() {
            const chatContainer = document.getElementById('chatContainer');
            const chatToggle = document.getElementById('chatToggle');

            chatContainer.style.display = 'none';
            chatToggle.style.display = 'flex';

            // Add bounce animation to draw attention
            chatToggle.classList.add('bounce');
            setTimeout(() => {
                chatToggle.classList.remove('bounce');
            }, 1000);
        }

        // Show chat toggle on page load
        window.addEventListener('load', () => {
            const chatToggle = document.getElementById('chatToggle');
            chatToggle.style.display = 'flex';

            // Show notification badge after a delay
            setTimeout(() => {
                document.getElementById('notificationBadge').style.display = 'flex';
            }, 2000);
        });
    </script>
</body>

</html>
